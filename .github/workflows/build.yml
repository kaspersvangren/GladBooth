name: Byg app

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency: build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.10.2'

      - name: Versionsnummer og siden ind i appen
        shell: bash
        run: |
          # Versionen står ét sted: const VERSION = '2.0.0' i index.html
          VERSION_NAME=$(grep -m1 -oE "const VERSION = '[0-9]+\.[0-9]+\.[0-9]+'" index.html | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          if [ -z "$VERSION_NAME" ]; then echo "Fandt ikke versionsnummeret i index.html" | tee build.log; exit 1; fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "TAG=byg-${{ github.run_number }}" >> "$GITHUB_ENV"
          # Appen viser præcis den samme side, som ligger i roden
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

      - name: Byg APK
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Udgiv på GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk GladBooth.apk
          git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session|Signed-off-by):' > notes.txt
          printf '\nBygget fra %s\nByggenummer %s\n' "${GITHUB_SHA::7}" "${{ github.run_number }}" >> notes.txt
          if [ "${{ github.run_attempt }}" != "1" ] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" GladBooth.apk \
            --title "GladBooth $VERSION_NAME (byg ${{ github.run_number }})" \
            --notes-file notes.txt --latest

      - name: Gem byggelog (til fejlfinding)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          REPO="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          cp build.log /tmp/build.log 2>/dev/null || echo "ingen log" > /tmp/build.log
          if ! git clone -q --depth 1 --branch build-log "$REPO" /tmp/logbranch 2>/dev/null; then
            mkdir -p /tmp/logbranch && cd /tmp/logbranch && git init -q -b build-log && cd - >/dev/null
          fi
          cp /tmp/build.log /tmp/logbranch/build.log
          echo "${{ job.status }} ${GITHUB_SHA} run ${{ github.run_number }}" > /tmp/logbranch/status.txt
          cd /tmp/logbranch
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Byggelog ${GITHUB_SHA::7} (run ${{ github.run_number }})"
          for i in 1 2 3; do
            if git push "$REPO" HEAD:build-log 2>push.err; then exit 0; fi
            echo "Forsøg $i på at gemme byggeloggen fejlede:"; sed 's/x-access-token:[^@]*@/***@/' push.err
            sleep $((i * 5))
            git pull -q --rebase -X theirs "$REPO" build-log 2>/dev/null || true
          done
          exit 1
