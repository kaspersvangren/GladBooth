:root{
  --pine:#0e2f24; --pine-deep:#081c15; --pine-lit:#1d5a45;
  --berry:#c21f3a; --berry-deep:#8a1127;
  --paper:#fdfbf5; --brass:#f2c35c; --ink:#22302b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--pine-deep);color:#fff;
  font-family:"Bagel",system-ui,sans-serif;-webkit-user-select:none;user-select:none;
  touch-action:manipulation;overscroll-behavior:none}
button{font:inherit}

/* ---------- kamera ---------- */
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#cam.mirror{transform:scaleX(-1)}

/* ---------- lag ---------- */
.layer{position:fixed;inset:0;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s .35s}
.layer.on{opacity:1;visibility:visible;transition:opacity .35s ease}
#live{z-index:10}#count{z-index:20}#review,#idle{z-index:30}#start,#error{z-index:40}
#flash{z-index:50}#corner{z-index:60}#toast{z-index:70}#menu{z-index:80}

/* ---------- knapper ---------- */
.btn{appearance:none;border:0;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  padding:0 1.3em;height:3.1em;border-radius:1.55em;font-size:clamp(18px,3.1vmin + 8px,30px);line-height:1;
  cursor:pointer;white-space:nowrap;transition:transform .08s ease,box-shadow .08s ease}
.btn svg{width:1.15em;height:1.15em;flex:none}
.btn.red{background:var(--berry);box-shadow:0 .22em 0 var(--berry-deep),0 .55em 1.1em rgba(0,0,0,.4)}
.btn.red:active{transform:translateY(.16em);box-shadow:0 .06em 0 var(--berry-deep),0 .2em .5em rgba(0,0,0,.4)}
.btn.paper{background:var(--paper);color:var(--pine);box-shadow:0 .22em 0 #cbc3ad,0 .55em 1.1em rgba(0,0,0,.4)}
.btn.paper:active{transform:translateY(.16em);box-shadow:0 .06em 0 #cbc3ad,0 .2em .5em rgba(0,0,0,.4)}
.btn.glass{background:rgba(8,28,21,.55);box-shadow:inset 0 0 0 2px rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn.glass:active{background:rgba(8,28,21,.8);transform:scale(.97)}
.btn.plain{background:none;height:2.4em;font-size:clamp(16px,2.4vmin + 7px,24px);text-decoration:underline;
  text-decoration-thickness:2px;text-underline-offset:.22em;opacity:.92}
.btn:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.btn[hidden]{display:none}

/* ---------- live ---------- */
#live{display:flex;align-items:flex-end;justify-content:center;
  padding:0 16px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(4,16,12,.62),rgba(4,16,12,0) 36%)}
.dock{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

/* ---------- nedtælling ---------- */
#count{display:grid;place-items:center;pointer-events:none}
.say{display:block;text-align:center;line-height:.9;color:#fff;white-space:nowrap;
  text-shadow:0 .045em 0 var(--berry),0 .09em 0 var(--berry-deep),0 .16em .28em rgba(0,0,0,.5);
  animation:pop 1s cubic-bezier(.2,.8,.2,1) both}
.say.num{font-size:min(84vh,48vw)}
.say.ready{font-size:min(30vh,10.5vw)}
.say.smile{font-size:min(62vh,27vw);color:var(--brass)}
.say.again{font-size:min(42vh,17vw)}
@keyframes pop{
  0%{opacity:0;transform:scale(1.9) rotate(var(--r,-7deg))}
  16%{opacity:1;transform:scale(.93) rotate(calc(var(--r,-7deg) * -.25))}
  28%{transform:scale(1) rotate(0)}
  82%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(.82)}
}

/* ---------- blink ---------- */
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .75s ease-out}
#flash.on{opacity:1;transition:none}

/* ---------- polaroid ---------- */
.slot{position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) translate(var(--dx,0px),var(--dy,0px)) rotate(var(--tilt,0deg)) scale(var(--sc,1));
  transition:transform .5s cubic-bezier(.2,.85,.25,1),opacity .45s ease,filter .4s ease}
.slot.back{filter:brightness(.7)}
.slot.out-up{transform:translate(-50%,-50%) translate(0,-120vh) rotate(-14deg);opacity:0}
.slot.out-down{transform:translate(-50%,-50%) translate(0,75vh) rotate(16deg) scale(.85);opacity:0}
.slot.fade{opacity:0;transform:translate(-50%,-50%) translate(0,4vh) rotate(var(--tilt,0deg)) scale(.96);transition-duration:.9s}
.polaroid{margin:0;padding:calc(var(--u)*.06) calc(var(--u)*.06) 0;border-radius:calc(var(--u)*.012);
  background:linear-gradient(172deg,#fffefb 0%,#f8f4ea 70%,#f1ecdf 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 calc(var(--u)*.008) calc(var(--u)*.02) rgba(0,0,0,.35),
    0 calc(var(--u)*.09) calc(var(--u)*.17) calc(var(--u)*-.03) rgba(0,0,0,.6);
  animation:pol-in .85s cubic-bezier(.2,.9,.25,1) .12s both}
@keyframes pol-in{from{opacity:0;transform:translateY(7%) scale(.9) rotate(2.5deg)}to{opacity:1;transform:none}}
.photo{position:relative;overflow:hidden;width:var(--pw);height:var(--ph);background:#aeb8b2}
.photo img,.photo canvas{display:block;width:100%;height:100%;object-fit:cover}
.photo::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),inset 0 calc(var(--u)*.008) calc(var(--u)*.03) rgba(0,0,0,.28)}
.veil{position:absolute;inset:0;opacity:0;pointer-events:none;background:linear-gradient(160deg,#cdd4cc,#a9b4af)}
.polaroid figcaption{height:calc(var(--u)*.24);display:grid;place-items:center;overflow:hidden;white-space:nowrap;
  font-family:"Caveat",cursive;font-weight:700;font-size:var(--fs);color:#2b3a34;transform:rotate(-1.2deg)}
/* fremkaldelsen */
.polaroid.dev img,.polaroid.dev canvas{animation:dev-img 4.2s cubic-bezier(.3,0,.2,1) .25s both}
.polaroid.dev .veil{animation:dev-veil 3.5s cubic-bezier(.4,0,.3,1) .25s both}
@keyframes dev-veil{0%,10%{opacity:1}100%{opacity:0}}
@keyframes dev-img{
  0%{filter:contrast(.35) saturate(0) brightness(1.3) sepia(.5) blur(3px)}
  55%{filter:contrast(.75) saturate(.55) brightness(1.12) sepia(.25) blur(.6px)}
  100%{filter:contrast(1) saturate(1) brightness(1) sepia(0) blur(0)}
}

/* ---------- gennemsyn ---------- */
#review{display:grid;grid-template-columns:1fr auto;background:var(--pine-deep);overflow:hidden}
#revBg{position:absolute;left:-12%;top:-12%;width:124%;height:124%;
  filter:blur(42px) saturate(1.25) brightness(.42)}
#review::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(90% 90% at 40% 45%,rgba(8,28,21,0) 30%,rgba(8,28,21,.75) 100%)}
#stage{position:relative;z-index:1;min-width:0;min-height:0;touch-action:none}
.actions{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:16px;
  padding:16px calc(22px + env(safe-area-inset-right)) 16px 6px}
.nav{position:absolute;top:50%;z-index:20;width:56px;height:56px;margin-top:-28px;border-radius:50%;border:0;color:#fff;
  display:grid;place-items:center;cursor:pointer;background:rgba(8,28,21,.6);box-shadow:inset 0 0 0 2px rgba(255,255,255,.85)}
.nav svg{width:26px;height:26px}
.nav:active{transform:scale(.94)}
#prev{left:calc(14px + env(safe-area-inset-left))}#next{right:10px}
#pager{position:absolute;left:0;right:0;bottom:8px;z-index:20;text-align:center;
  font-family:"Caveat",cursive;font-weight:700;font-size:clamp(20px,4.5vmin,30px);text-shadow:0 2px 6px rgba(0,0,0,.6)}
.nav[hidden],#pager[hidden]{display:none}
@media (orientation:portrait){
  #review{grid-template-columns:none;grid-template-rows:1fr auto}
  .actions{flex-direction:row;flex-wrap:wrap;justify-content:center;padding:6px 16px calc(22px + env(safe-area-inset-bottom))}
}

/* ---------- hvile ---------- */
#idle,#start,#error{background:radial-gradient(120% 95% at 50% 28%,var(--pine-lit) 0%,var(--pine) 55%,var(--pine-deep) 100%)}
.snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#idleStage{position:absolute;inset:4% 0 17% 0}
#idle .hint{position:absolute;left:0;right:0;bottom:calc(5% + env(safe-area-inset-bottom));margin:0;text-align:center;
  font-size:clamp(20px,6.2vmin,44px);text-shadow:0 .08em 0 var(--berry-deep),0 .2em .4em rgba(0,0,0,.45);
  animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.72}50%{opacity:1}}

/* ---------- start og fejl ---------- */
#start,#error{display:grid;place-items:center;text-align:center;padding:20px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,3vmin,22px);max-width:40em}
h1{margin:0;font-weight:400;line-height:.95;font-size:min(24vh,13vw);
  text-shadow:0 .05em 0 var(--berry),0 .1em 0 var(--berry-deep),0 .18em .3em rgba(0,0,0,.45)}
h2{margin:0;font-weight:400;line-height:1.05;font-size:clamp(26px,7vmin,48px)}
.hand{margin:0;font-family:"Caveat",cursive;font-weight:700;color:var(--brass);line-height:1;
  font-size:clamp(26px,9vmin,60px);transform:rotate(-2deg)}
.fine{margin:0;font-family:system-ui,sans-serif;font-size:clamp(13px,2.2vmin + 6px,17px);line-height:1.45;
  color:rgba(255,255,255,.78);max-width:34em}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

/* ---------- hjørne, besked ---------- */
#corner{position:fixed;left:0;top:0;width:84px;height:84px}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-160%);
  background:var(--paper);color:var(--pine);padding:.5em 1.1em;border-radius:2em;font-size:clamp(18px,3vmin + 8px,26px);
  display:flex;align-items:center;gap:.4em;box-shadow:0 8px 24px rgba(0,0,0,.4);pointer-events:none;opacity:0;
  transition:transform .35s cubic-bezier(.2,.9,.3,1.2),opacity .2s ease}
#toast.on{transform:translate(-50%,0);opacity:1}
#toast svg{width:1.1em;height:1.1em}
#toast.bad svg{display:none}
#ver{position:absolute;right:calc(10px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom));
  font:12px system-ui,sans-serif;color:rgba(255,255,255,.38)}

/* ---------- indstillinger ---------- */
#menu{position:fixed;inset:0;display:none;place-items:center;padding:14px;background:rgba(4,14,10,.72);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
#menu.on{display:grid}
.sheet{width:min(600px,100%);max-height:100%;overflow:auto;background:#f7f4ec;border-radius:18px;padding:18px 20px 14px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);-webkit-user-select:text;user-select:text}
.sheet h3{margin:0 0 10px;font:400 26px/1 "Bagel",system-ui;color:var(--pine)}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid #e1dccd;font-size:16px}
.set label,.set span.l{flex:1;min-width:0}
.set small{display:block;color:#66736d;font-size:13px;margin-top:2px}
.set input[type=text]{flex:1.2;min-width:0;font:inherit;padding:9px 11px;border:1.5px solid #bfb9a7;border-radius:9px;background:#fff;color:var(--ink)}
.set input[type=checkbox]{appearance:none;width:52px;height:30px;border-radius:15px;background:#c5bfae;position:relative;flex:none;cursor:pointer;transition:background .15s}
.set input[type=checkbox]::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.set input[type=checkbox]:checked{background:var(--pine-lit)}
.set input[type=checkbox]:checked::after{transform:translateX(22px)}
.seg{display:flex;border:1.5px solid #bfb9a7;border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:#fff;color:var(--ink);padding:9px 13px;font-size:15px;cursor:pointer}
.seg button+button{border-left:1.5px solid #bfb9a7}
.seg button[aria-pressed=true]{background:var(--pine-lit);color:#fff}
.mb{border:1.5px solid var(--pine-lit);background:#fff;color:var(--pine);padding:9px 14px;border-radius:9px;font-size:15px;cursor:pointer;flex:none}
.mb.solid{background:var(--pine-lit);color:#fff}
.mb.danger{border-color:var(--berry);color:var(--berry)}
.mb.danger.armed{background:var(--berry);color:#fff}
.mb:disabled{opacity:.45}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:12px;border-top:1px solid #e1dccd;color:#66736d;font-size:13px}
input:focus-visible,.mb:focus-visible,.seg button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

@media (prefers-reduced-motion:reduce){
  .say{animation-name:pop-calm}
  @keyframes pop-calm{0%{opacity:0}15%,85%{opacity:1}100%{opacity:0}}
  .polaroid{animation-duration:.3s}
  #idle .hint{animation:none}
}
</style>
</head>

<script>
(() => {
'use strict';
const VERSION = '1.0.1';
const IDLE_MS = 30000;      // stilstand før diasshowet starter
const REVIEW_MS = 60000;    // et billede, ingen har taget stilling til, kasseres
const SLIDE_MS = 6000;
const GAP_MS = 1500;        // mellem billederne i en sekvens

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const video = $('#cam'), flash = $('#flash'), sayBox = $('#say'), stage = $('#stage'), idleStage = $('#idleStage');
const LAYERS = ['start', 'live', 'count', 'review', 'idle', 'error'];

/* ---------- indstillinger ---------- */
const settings = Object.assign({caption: 'Julefest ' + new Date().getFullYear(), lead: 2, sound: true, download: true, facing: 'user'},
  (() => { try { return JSON.parse(localStorage.getItem('photobooth') || '{}'); } catch (e) { return {}; } })());
const saveSettings = () => { try { localStorage.setItem('photobooth', JSON.stringify(settings)); } catch (e) {} };

/* ---------- lager (IndexedDB) ---------- */
const DB = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('photobooth', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos', {keyPath: 'id', autoIncrement: true});
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('photos', mode), rq = fn(t.objectStore('photos'));
      t.oncomplete = () => res(rq.result);
      t.onerror = t.onabort = () => rej(t.error);
    });
  };
  return {
    add: r => tx('readwrite', s => s.add(r)),
    keys: () => tx('readonly', s => s.getAllKeys()),
    get: id => tx('readonly', s => s.get(id)),
    count: () => tx('readonly', s => s.count()),
    clear: () => tx('readwrite', s => s.clear()),
  };
})();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- tilstand ---------- */
let state = 'start', runId = 0, idleT = 0, revT = 0, slideT = 0, menuOpen = false;
function setState(s) {
  state = s;
  document.body.dataset.state = s;
  for (const l of LAYERS) $('#' + l).classList.toggle('on', l === s);
  clearTimeout(idleT); clearTimeout(revT); clearInterval(slideT);
  snow.sync();
  if (s === 'live') armIdle();
  if (s === 'review') armReview();
}
function armIdle() { clearTimeout(idleT); if (state === 'live' && !menuOpen) idleT = setTimeout(enterIdle, IDLE_MS); }
function armReview() { clearTimeout(revT); if (state === 'review') revT = setTimeout(discardAll, REVIEW_MS); }

/* ---------- fuld skærm og vågen skærm ---------- */
function goFull() {
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen({navigationUI: 'hide'}).catch(() => {});
}
let wake = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wake = await navigator.wakeLock.request('screen'); } catch (e) {}
}

/* ---------- lyd ---------- */
let ac = null;
function audio() {
  if (!settings.sound) return null;
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  } catch (e) { return null; }
}
function beep(freq, dur, vol) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = 'triangle'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
function click() {
  const a = audio(); if (!a) return;
  const n = Math.floor(a.sampleRate * .09), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  const src = a.createBufferSource(), g = a.createGain(); src.buffer = buf; g.gain.value = .5;
  src.connect(g).connect(a.destination); src.start();
  beep(180, .06, .25);
}

/* ---------- kamera ---------- */
let stream = null, demoRaf = 0;
function stopStream() {
  cancelAnimationFrame(demoRaf);
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
}
async function startCamera() {
  stopStream();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    const e = new Error('insecure'); e.name = 'InsecureError'; throw e;
  }
  stream = await navigator.mediaDevices.getUserMedia({audio: false,
    video: {facingMode: {ideal: settings.facing}, width: {ideal: 2560}, height: {ideal: 1440}}});
  const st = stream.getVideoTracks()[0].getSettings();
  video.classList.toggle('mirror', (st.facingMode || settings.facing) === 'user');
  video.srcObject = stream;
  await video.play();
}
function startDemo() {
  stopStream();
  const c = document.createElement('canvas'); c.width = 1280; c.height = 720;
  const x = c.getContext('2d'); let t = 0;
  const draw = () => {
    t += 1 / 60;
    const g = x.createLinearGradient(0, 0, 1280, 720); g.addColorStop(0, '#f4b860'); g.addColorStop(1, '#b6455a');
    x.fillStyle = g; x.fillRect(0, 0, 1280, 720);
    [['#fdf1dc', 420, 0], ['#f7d9c4', 660, 1.3], ['#e8c3a6', 890, 2.4]].forEach(([col, cx, ph]) => {
      const cy = 380 + Math.sin(t * 1.6 + ph) * 26;
      x.fillStyle = col; x.beginPath(); x.arc(cx, cy, 110, 0, 7); x.fill();
      x.fillStyle = '#3a2a2a'; x.beginPath(); x.arc(cx - 38, cy - 22, 11, 0, 7); x.arc(cx + 38, cy - 22, 11, 0, 7); x.fill();
      x.strokeStyle = '#3a2a2a'; x.lineWidth = 9; x.lineCap = 'round'; x.beginPath(); x.arc(cx, cy + 14, 52, .25, Math.PI - .25); x.stroke();
    });
    x.fillStyle = 'rgba(255,255,255,.92)'; x.font = '600 40px system-ui,sans-serif'; x.textAlign = 'center';
    x.fillText('Demo uden kamera', 640, 110);
    demoRaf = requestAnimationFrame(draw);
  };
  draw();
  stream = c.captureStream(30);
  video.classList.remove('mirror');
  video.srcObject = stream;
  return video.play();
}
async function boot(demo) {
  goFull(); keepAwake(); audio();
  try {
    await (demo ? startDemo() : startCamera());
    setState('live');
  } catch (e) {
    const why = e && e.name;
    $('#errText').textContent =
      why === 'NotAllowedError' ? 'Siden har ikke fået lov til at bruge kameraet. Tryk på ikonet til venstre for adressen, giv lov til kamera, og prøv igen.' :
      why === 'NotFoundError' || why === 'OverconstrainedError' ? 'Der blev ikke fundet noget kamera på enheden.' :
      why === 'NotReadableError' ? 'Kameraet er optaget af en anden app. Luk den, og prøv igen.' :
      why === 'InsecureError' ? 'Kameraet virker kun, når siden åbnes via https.' :
      'Der skete en fejl, da kameraet skulle startes. Prøv igen.';
    setState('error');
  }
}
/* JPEG-pakningen sker på sin egen tråd, så blinket aldrig venter på den.
   (canvas.toBlob venter på ledig tid i browseren, og den er der næsten ingen af, mens kameraet kører.) */
const encode = (() => {
  let worker = null, seq = 0;
  const jobs = new Map();
  try {
    if (window.Worker && window.OffscreenCanvas && window.createImageBitmap) {
      const src = "onmessage=async e=>{const{id,bmp}=e.data;try{const c=new OffscreenCanvas(bmp.width,bmp.height);c.getContext('2d').drawImage(bmp,0,0);bmp.close();postMessage({id,blob:await c.convertToBlob({type:'image/jpeg',quality:.92})})}catch(err){postMessage({id,error:String(err)})}}";
      worker = new Worker(URL.createObjectURL(new Blob([src], {type: 'text/javascript'})));
      worker.onmessage = e => { const j = jobs.get(e.data.id); if (!j) return; jobs.delete(e.data.id); e.data.blob ? j.res(e.data.blob) : j.rej(new Error(e.data.error)); };
      worker.onerror = () => { worker = null; jobs.forEach(j => j.rej(new Error('worker'))); jobs.clear(); };
    }
  } catch (e) { worker = null; }
  const onMain = c => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/jpeg', .92));
  const inWorker = c => createImageBitmap(c).then(bmp => new Promise((res, rej) => {
    if (!worker) { bmp.close(); return rej(new Error('no worker')); }
    const id = ++seq; jobs.set(id, {res, rej});
    setTimeout(() => { if (jobs.delete(id)) rej(new Error('timeout')); }, 8000);
    worker.postMessage({id, bmp}, [bmp]);
  }));
  return c => (worker ? inWorker(c).catch(() => onMain(c)) : onMain(c)).finally(() => { c.width = c.height = 0; });
})();
// Fryser billedet med det samme. Intet her venter på noget.
function grab() {
  const w = video.videoWidth, h = video.videoHeight;
  const full = document.createElement('canvas'); full.width = w; full.height = h;
  full.getContext('2d').drawImage(video, 0, 0, w, h);          // gemmes ikke spejlvendt
  const k = Math.min(1, 1600 / Math.max(w, h));
  const view = document.createElement('canvas'); view.width = Math.round(w * k); view.height = Math.round(h * k);
  view.getContext('2d').drawImage(full, 0, 0, view.width, view.height);   // det, polaroidet viser
  const s = {w, h, view, ts: Date.now(), blob: encode(full)};
  s.blob.catch(() => {});
  return s;
}

/* ---------- nedtælling og optagelse ---------- */
let flip = 1;
function say(text, kind, dur) {
  sayBox.replaceChildren();
  if (!text) return;
  const s = document.createElement('span');
  s.className = 'say ' + kind; s.textContent = text;
  flip = -flip; s.style.setProperty('--r', (flip * 7) + 'deg');
  s.style.animationDuration = dur + 'ms';
  sayBox.append(s);
}
async function shoot(n) {
  if (state !== 'live' || !video.videoWidth) return;
  goFull(); audio();
  const my = ++runId, alive = () => my === runId && state === 'count';
  setState('count');
  if (settings.lead > 0) { say('Gør jer klar!', 'ready', settings.lead * 1000); await sleep(settings.lead * 1000); if (!alive()) return; }
  for (const t of ['3', '2', '1']) { say(t, 'num', 1000); beep(660, .14, .22); await sleep(1000); if (!alive()) return; }
  say('Smil!', 'smile', 800); beep(990, .3, .24); await sleep(750); if (!alive()) return;
  const got = [];
  try {
    for (let i = 0; i < n; i++) {
      if (i > 0) { say(i === n - 1 ? 'Sidste!' : 'Én til!', 'again', GAP_MS - 150); await sleep(GAP_MS - 150); if (!alive()) return; }
      say('');
      flash.classList.add('on'); click();
      got.push(grab());
      if (i < n - 1) { await sleep(110); flash.classList.remove('on'); await sleep(40); }
    }
  } catch (e) { flash.classList.remove('on'); setState('live'); return; }
  showReview(got);
  await sleep(160);
  flash.classList.remove('on');
}

/* ---------- polaroid ---------- */
function sizeFor(a, sw, sh, k) {
  if (a >= 1) { const u = Math.min(sh * k / 1.30, sw * k / (a + .12)); return {u, pw: u * a, ph: u}; }
  const u = Math.min(sw * k / 1.12, sh * k / (1 / a + .30)); return {u, pw: u, ph: u / a};
}
function makeSlot(src, tilt, develop) {
  const slot = document.createElement('div'); slot.className = 'slot';
  slot.innerHTML = '<figure class="polaroid"><div class="photo"><i class="veil"></i></div><figcaption></figcaption></figure>';
  if (develop) slot.firstChild.classList.add('dev');
  slot.querySelector('.photo').prepend(typeof src === 'string' ? Object.assign(new Image(), {src, alt: ''}) : src);
  slot.querySelector('figcaption').textContent = settings.caption;
  slot.style.setProperty('--tilt', tilt + 'deg');
  return slot;
}
function sizeSlot(slot, z) {
  const st = slot.style;
  st.setProperty('--u', z.u + 'px'); st.setProperty('--pw', z.pw + 'px'); st.setProperty('--ph', z.ph + 'px');
  st.setProperty('--fs', Math.min(z.u * .14, z.pw * 1.9 / Math.max(8, settings.caption.length)) + 'px');
}

/* ---------- gennemsyn ---------- */
let shots = [], cur = 0, busy = false;
function showReview(list) {
  stage.querySelectorAll('.slot').forEach(e => e.remove());
  shots = list; cur = 0; busy = false;
  const tilts = list.length === 1 ? [(Math.random() < .5 ? -1 : 1) * (2.6 + Math.random() * 1.6)] : [-3.6, 3, -2.4];
  list.forEach((s, i) => {
    s.name = fileName(list[0].ts, list.length > 1 ? i + 1 : 0);
    s.el = makeSlot(s.view, tilts[i % tilts.length], true); stage.append(s.el);
  });
  setState('review');
  layoutStack();
}
function layoutStack() {
  const r = stage.getBoundingClientRect(), n = shots.length, multi = n > 1;
  shots.forEach((s, i) => {
    const z = sizeFor(s.w / s.h, r.width, r.height, multi ? .74 : .82), o = ((i - cur) % n + n) % n, st = s.el.style;
    sizeSlot(s.el, z);
    st.setProperty('--dx', (o === 0 ? 0 : o === 1 ? z.u * .2 : -z.u * .2) + 'px');
    st.setProperty('--dy', (o === 0 ? 0 : o === 1 ? -z.u * .05 : z.u * .05) + 'px');
    st.setProperty('--sc', o === 0 ? 1 : o === 1 ? .93 : .88);
    st.zIndex = 10 - o;
    s.el.classList.toggle('back', o > 0);
  });
  $('#prev').hidden = $('#next').hidden = $('#pager').hidden = !multi;
  $('#pager').textContent = multi ? (cur + 1) + ' af ' + n : '';
  $('#btnKeep span').textContent = multi ? 'Gem dette' : 'Gem og tag nyt';
  $('#btnDrop span').textContent = multi ? 'Slet dette' : 'Slet og tag nyt';
  $('#btnKeepAll').hidden = !multi;
  $('#btnKeepAll').textContent = 'Gem alle ' + n;
  if (shots[cur]) paintBg(shots[cur]);
}
function paintBg(s) {
  const b = $('#revBg'); b.width = 48; b.height = Math.max(1, Math.round(48 * s.h / s.w));
  b.getContext('2d').drawImage(s.view, 0, 0, b.width, b.height);
}
function step(d) { if (shots.length < 2) return; cur = (cur + d + shots.length) % shots.length; layoutStack(); armReview(); }
const pad = n => String(n).padStart(2, '0');
function fileName(ts, idx) {
  const d = new Date(ts);
  return 'photobooth-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + (idx ? '-' + idx : '') + '.jpg';
}
function download(blob, name) {
  const a = document.createElement('a'), url = URL.createObjectURL(blob);
  a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
// Gemmer i baggrunden, ét billede ad gangen. Skærmen venter ikke.
let saveChain = Promise.resolve();
function persist(s) {
  saveChain = saveChain.then(async () => {
    let blob;
    try { blob = await s.blob; } catch (e) { toast('Billedet kunne ikke gemmes', false); return; }
    let stored = false;
    try { await DB.add({blob, w: s.w, h: s.h, ts: s.ts, name: s.name}); stored = true; } catch (e) {}
    if (settings.download || !stored) { download(blob, s.name); await sleep(250); }   // uden lager er Overførsler eneste kopi
  });
  return saveChain;
}
function leave(s, cls) {
  s.el.classList.add(cls);
  const el = s.el, view = s.view;
  setTimeout(() => { el.remove(); view.width = view.height = 0; }, 520);
}
async function resolve(keep, all) {
  if (state !== 'review' || busy || !shots.length) return;
  busy = true; goFull();
  const targets = all ? shots.slice() : [shots[cur]];
  for (const s of targets) {
    if (keep) persist(s);
    leave(s, keep ? 'out-up' : 'out-down');
    if (all && keep) await sleep(260);
  }
  if (keep) toast(targets.length > 1 ? targets.length + ' billeder gemt' : 'Gemt');
  shots = shots.filter(s => !targets.includes(s));
  if (cur >= shots.length) cur = 0;
  if (shots.length) { layoutStack(); armReview(); busy = false; return; }
  await sleep(380);
  busy = false;
  if (state === 'review') setState('live');
}
function discardAll() {
  if (state !== 'review') return;
  shots.forEach(s => leave(s, 'out-down')); shots = [];
  setTimeout(() => { if (state === 'review') setState('live'); }, 400);
}
let toastT = 0;
function toast(text, ok) {
  const t = $('#toast'); t.querySelector('span').textContent = text; t.classList.toggle('bad', ok === false); t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1500);
}

/* ---------- hvile: diasshow af gemte billeder ---------- */
let idleKeys = [], idleI = 0;
async function enterIdle() {
  if (state !== 'live' || menuOpen) return;
  let keys = [];
  try { keys = await DB.keys(); } catch (e) {}
  if (!keys.length || state !== 'live') { armIdle(); return; }
  idleKeys = keys.reverse(); idleI = 0;
  idleStage.replaceChildren();
  setState('idle');
  nextSlide();
  slideT = setInterval(nextSlide, SLIDE_MS);
}
async function nextSlide() {
  const id = idleKeys[idleI++ % idleKeys.length];
  let rec; try { rec = await DB.get(id); } catch (e) {}
  if (!rec || state !== 'idle') return;
  const url = URL.createObjectURL(rec.blob), r = idleStage.getBoundingClientRect();
  const slot = makeSlot(url, (idleI % 2 ? -1 : 1) * (2.2 + Math.random() * 2), false);
  slot.dataset.url = url; slot.dataset.a = rec.w / rec.h;
  sizeSlot(slot, sizeFor(rec.w / rec.h, r.width, r.height, .84));
  idleStage.querySelectorAll('.slot').forEach(old => {
    old.classList.add('fade');
    setTimeout(() => { old.remove(); URL.revokeObjectURL(old.dataset.url); }, 950);
  });
  idleStage.append(slot);
}

/* ---------- sne ---------- */
const snow = (() => {
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let raf = 0, cv = null, flakes = [];
  const tick = () => {
    const c = cv, x = c.getContext('2d'), w = c.width, h = c.height;
    x.clearRect(0, 0, w, h); x.fillStyle = '#fff';
    for (const f of flakes) {
      f.y += f.v; f.x += Math.sin(f.y * .012 + f.p) * .35;
      if (f.y > h + 6) { f.y = -6; f.x = Math.random() * w; }
      x.globalAlpha = f.a; x.beginPath(); x.arc(f.x, f.y, f.r, 0, 7); x.fill();
    }
    raf = requestAnimationFrame(tick);
  };
  return {sync() {
    cancelAnimationFrame(raf); raf = 0;
    const host = state === 'start' || state === 'idle' ? $('#' + state + ' .snow') : null;
    if (!host || calm) return;
    cv = host;
    const d = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth * d; cv.height = innerHeight * d;
    flakes = Array.from({length: 46}, () => ({x: Math.random() * cv.width, y: Math.random() * cv.height,
      r: (.8 + Math.random() * 2) * d, v: (.25 + Math.random() * .7) * d, a: .25 + Math.random() * .55, p: Math.random() * 6}));
    tick();
  }};
})();

/* ---------- zip (uden komprimering; JPEG er allerede pakket) ---------- */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u) { let c = -1; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ -1) >>> 0; }
async function makeZip(progress) {
  const keys = await DB.keys(), enc = new TextEncoder(), parts = [], cen = [];
  let off = 0, n = 0;
  for (let i = 0; i < keys.length; i++) {
    const r = await DB.get(keys[i]); if (!r) continue;
    const data = new Uint8Array(await r.blob.arrayBuffer()), name = enc.encode(r.name), crc = crc32(data), d = new Date(r.ts);
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
    parts.push(lh, name, r.blob);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, off, true);
    cen.push(ch, name);
    off += 30 + name.length + data.length; n++;
    if (progress) progress(i + 1, keys.length);
  }
  let cs = 0; for (const c of cen) cs += c.byteLength;
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, n, true); e.setUint16(10, n, true); e.setUint32(12, cs, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...cen, e], {type: 'application/zip'});
}

/* ---------- indstillingsmenu ---------- */
const menu = $('#menu');
async function refreshMenu() {
  let n = 0; try { n = await DB.count(); } catch (e) {}
  $('#mCount').textContent = 'Gemte billeder: ' + n;
  $('#mZip').disabled = $('#mClear').disabled = !n;
  $('#mCaption').value = settings.caption;
  $('#mSound').checked = settings.sound; $('#mDownload').checked = settings.download;
  $('#mLead').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === settings.lead)));
  $('#mCamInfo').textContent = (settings.facing === 'user' ? 'Frontkamera' : 'Bagkamera') + (video.videoWidth ? ', ' + video.videoWidth + ' × ' + video.videoHeight : '');
  $('#mFlip').disabled = state === 'start' || state === 'error';
  $('#mVer').textContent = 'Photobooth v' + VERSION;
  const c = $('#mClear'); c.classList.remove('armed'); c.textContent = 'Slet alle';
}
function openMenu() {
  if (state === 'count') return;
  if (state === 'idle') setState('live');
  menuOpen = true; clearTimeout(idleT); clearTimeout(revT);
  refreshMenu(); menu.classList.add('on');
}
function closeMenu() {
  menuOpen = false; menu.classList.remove('on');
  $('#startCaption').textContent = settings.caption;
  document.querySelectorAll('.polaroid figcaption').forEach(f => f.textContent = settings.caption);
  if (state === 'review') layoutStack();
  armIdle(); armReview();
}
$('#mCaption').addEventListener('input', e => { settings.caption = e.target.value.trim() || ' '; saveSettings(); });
$('#mLead').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; settings.lead = +b.dataset.v; saveSettings(); refreshMenu(); });
$('#mSound').addEventListener('change', e => { settings.sound = e.target.checked; saveSettings(); if (settings.sound) beep(660, .14, .22); });
$('#mDownload').addEventListener('change', e => { settings.download = e.target.checked; saveSettings(); });
$('#mFlip').addEventListener('click', async () => {
  settings.facing = settings.facing === 'user' ? 'environment' : 'user'; saveSettings();
  try { await startCamera(); } catch (e) { settings.facing = settings.facing === 'user' ? 'environment' : 'user'; saveSettings(); try { await startCamera(); } catch (e2) {} }
  refreshMenu();
});
$('#mZip').addEventListener('click', async e => {
  const b = e.currentTarget; b.disabled = true;
  try {
    const z = await makeZip((i, n) => { b.textContent = 'Pakker ' + i + ' af ' + n; });
    const d = new Date();
    download(z, 'photobooth-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '.zip');
  } catch (err) { alert('Billederne kunne ikke pakkes. Prøv igen.'); }
  b.textContent = 'Hent alle som zip'; b.disabled = false;
});
$('#mClear').addEventListener('click', async e => {
  const b = e.currentTarget;
  if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Tryk igen for at slette'; return; }
  try { await DB.clear(); } catch (err) {}
  refreshMenu();
});
$('#mFull').addEventListener('click', goFull);
$('#mClose').addEventListener('click', closeMenu);
menu.addEventListener('pointerdown', e => { if (e.target === menu) closeMenu(); });

// skjult indgang: hold en finger i øverste venstre hjørne
let holdT = 0;
const corner = $('#corner');
corner.addEventListener('pointerdown', () => { clearTimeout(holdT); holdT = setTimeout(openMenu, 900); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => corner.addEventListener(ev, () => clearTimeout(holdT)));
addEventListener('contextmenu', e => { if (!e.target.closest('.sheet')) e.preventDefault(); });

/* ---------- betjening ---------- */
$('#startCaption').textContent = settings.caption;
$('#ver').textContent = 'v' + VERSION;
$('#btnStart').addEventListener('click', () => boot(false));
$('#btnRetry').addEventListener('click', () => boot(false));
$('#btnDemo').addEventListener('click', () => boot(true));
$('#btnShot').addEventListener('click', () => shoot(1));
$('#btnSeq').addEventListener('click', () => shoot(3));
$('#btnKeep').addEventListener('click', () => resolve(true, false));
$('#btnDrop').addEventListener('click', () => resolve(false, false));
$('#btnKeepAll').addEventListener('click', () => resolve(true, true));
$('#prev').addEventListener('click', () => step(-1));
$('#next').addEventListener('click', () => step(1));
$('#idle').addEventListener('pointerdown', () => { goFull(); setState('live'); });

let downX = null;
stage.addEventListener('pointerdown', e => { downX = e.target.closest('.nav') ? null : e.clientX; armReview(); });
stage.addEventListener('pointerup', e => {
  if (downX === null) return;
  const dx = e.clientX - downX; downX = null;
  if (dx < -40) return step(1);
  if (dx > 40) return step(-1);
  const hit = e.target.closest('.slot.back');
  if (hit) { const i = shots.findIndex(s => s.el === hit); if (i >= 0) { cur = i; layoutStack(); } }
});
addEventListener('pointerdown', () => { if (state === 'live') armIdle(); }, true);
addEventListener('keydown', e => {
  if (menuOpen || e.repeat) return;
  if (state === 'idle') return setState('live');
  if (state === 'live' && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); shoot(1); }
  if (state === 'live' && e.key === '3') shoot(3);
  if (state === 'review' && e.key === 'ArrowRight') step(1);
  if (state === 'review' && e.key === 'ArrowLeft') step(-1);
});
addEventListener('resize', () => {
  if (state === 'review') layoutStack();
  if (state === 'idle') { const r = idleStage.getBoundingClientRect(); idleStage.querySelectorAll('.slot:not(.fade)').forEach(s => sizeSlot(s, sizeFor(+s.dataset.a, r.width, r.height, .84))); }
  snow.sync();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  keepAwake();
  const t = stream && stream.getVideoTracks()[0];
  if (state !== 'start' && state !== 'error' && (!t || t.readyState === 'ended')) startCamera().catch(() => setState('error'));
});

snow.sync();
})();
</script>
